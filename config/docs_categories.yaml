# URL-prefix → category tag. Consumed post-hoc by the phase-5 manifest
# builder to populate docs_paths_by_category from opencode's trajectory
# log. Categories: reference, example, tutorial, api, general.
# Matching is longest-prefix-wins on the path component of the URL.

# Josh (https://joshsim.org/...)
- prefix: "https://joshsim.org/tutorial"
  category: tutorial
- prefix: "https://joshsim.org/reference"
  category: reference
- prefix: "https://joshsim.org/examples"
  category: example
- prefix: "https://joshsim.org/"
  category: general

# Mesa (https://mesa.readthedocs.io/...)
- prefix: "https://mesa.readthedocs.io/en/stable/tutorials"
  category: tutorial
- prefix: "https://mesa.readthedocs.io/en/latest/tutorials"
  category: tutorial
- prefix: "https://mesa.readthedocs.io/en/stable/apis"
  category: api
- prefix: "https://mesa.readthedocs.io/en/latest/apis"
  category: api
- prefix: "https://mesa.readthedocs.io/en/stable/examples"
  category: example
- prefix: "https://mesa.readthedocs.io/en/latest/examples"
  category: example
- prefix: "https://mesa.readthedocs.io/"
  category: general

