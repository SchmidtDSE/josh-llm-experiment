# Per-run DNS query logger config. The fortree:dnsmasq image bakes this
# in (built from Dockerfile.dnsmasq). Passive observation only — every
# query the agent issues is written to dns.log, and that file is the
# post-hoc evidence record for what hosts the agent reached.
#
# History: this sidecar previously also enforced an egress allowlist
# via `ipset=/host/allowed_dst` directives + a companion iptables
# OUTPUT chain in sidecar-init.sh. The Phase 6 refactor moved cell
# execution from per-run docker bridges to k8s Pods, which cannot
# express the CAP_NET_ADMIN + shared-netns pattern that enforcement
# required, so the boundary was relaxed to monitored-only. The
# intended docs host allowlist is preserved in EXPERIMENTAL_DESIGN.md
# §Egress observability; it is no longer enforced at the kernel.

# ---------- query logging ----------
log-queries
log-facility=-

# ---------- upstream resolvers ----------
# Don't consult /etc/resolv.conf inside the container.
no-resolv
server=1.1.1.1
server=8.8.8.8

# ---------- listen config ----------
bind-interfaces
listen-address=0.0.0.0

# Keep the cache small so a previously-cached lookup doesn't bury a fresh
# query in the audit log.
cache-size=0
