# Per-run DNS + egress-allowlist config. The fortree:dnsmasq image bakes
# this in (Dockerfile dnsmasq stage). The sidecar logs every query AND
# enforces an egress allowlist: each `ipset=/host/allowed_dst` line below
# tells dnsmasq to add the resolved IPs for that host (and subdomains) to
# the `allowed_dst` netfilter ipset, which sidecar-init.sh's iptables
# OUTPUT chain matches against. Hosts not listed here still resolve via
# the upstream forwarders below, but their IPs never enter the ipset, so
# subsequent connect() calls hit a REJECT.
#
# launch_run.sh starts one of these per agent invocation; the agent
# container joins this sidecar's netns via --network=container:...
# (see orchestration/run_agent.sh).

# ---------- query logging ----------
log-queries
log-facility=-

# ---------- upstream resolvers ----------
# Don't consult /etc/resolv.conf inside the container.
no-resolv
server=1.1.1.1
server=8.8.8.8

# ---------- listen config ----------
bind-interfaces
listen-address=0.0.0.0

# Keep the cache small so a previously-cached lookup doesn't bury a fresh
# query in the audit log.
cache-size=0

# ---------- egress allowlist ----------
# dnsmasq's `ipset=/host/setname` directive: when a query for `host` (or
# any subdomain) is answered, the resolved IPs are added to `setname`.
# Domains here are the minimum set the agent needs for the ForeverTree
# experiment: the model API, the framework/language docs we point the
# agent at, and the core scientific-Python doc sites for the libraries
# pre-installed in the image. Hosts NOT listed here (e.g. pypi.org,
# stackoverflow.com, anything random the model might hallucinate) are
# logged on resolution but blocked at connect().

# Model API (OpenRouter — single endpoint, all models).
ipset=/openrouter.ai/allowed_dst

# Framework / DSL docs.
ipset=/mesa.readthedocs.io/allowed_dst
ipset=/joshsim.org/allowed_dst

# Python stdlib + the pre-installed scientific stack's docs.
ipset=/python.org/allowed_dst
ipset=/numpy.org/allowed_dst
ipset=/scipy.org/allowed_dst
ipset=/pandas.pydata.org/allowed_dst
ipset=/xarray.dev/allowed_dst
ipset=/unidata.github.io/allowed_dst

# Readthedocs serves a lot of the docs above; the apex sometimes lands
# on different IPs than mesa.readthedocs.io.
ipset=/readthedocs.io/allowed_dst
