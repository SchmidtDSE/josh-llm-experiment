# Per-run DNS sidecar config. The fortree:dnsmasq image bakes this in
# (Dockerfile dnsmasq stage). Used only for observation — every query the
# agent makes gets logged so we can record which hosts the model actually
# reached during a run. Hard egress enforcement (blocking unallowlisted
# names) is deliberately NOT done here; that's a future-phase concern.
#
# launch_run.sh starts one of these per agent invocation on a fresh docker
# bridge network and collects `docker logs` into runs/<id>/dns.log on
# teardown.

# Write logs to stderr so `docker logs <container>` captures them.
log-queries
log-facility=-

# Don't consult the container's /etc/resolv.conf; forward to a public
# resolver instead. 1.1.1.1 is Cloudflare; 8.8.8.8 (Google) as a fallback.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Listen on all interfaces inside the container.
bind-interfaces
listen-address=0.0.0.0

# Keep the cache small — we don't want a previously-cached lookup from
# burying a fresh query in the log.
cache-size=0
