[workspace]
channels = ["conda-forge"]
name = "josh-llm-experiment"
platforms = ["linux-64"]
version = "0.1.0"

# Host-side environment for the k8s submission path: render Job manifests,
# apply them with kubectl, pull per-cell artefacts back from the bucket
# with mc, aggregate + plot in analysis/headline.ipynb. The agent + scorer
# images don't go through pixi — they're built from Dockerfile and
# pushed to GHCR by .github/workflows/build-images.yml.
#
# Tools NOT managed here (installed by .devcontainer/devcontainer.json
# features or .devcontainer/post-create.sh): docker, kubectl, gcloud +
# gke-gcloud-auth-plugin, gh, mc.

[tasks]
# Download/refresh the Josh fat jars (dev + main) into jar/<branch>/,
# recording the sha256 anchor scripts/install_josh.sh uses. The `dev` jar is
# the MCP-enabled build (SchmidtDSE/josh#440); use it to smoke-test `josh mcp`
# locally or to capture a sha256 for a pinned image build. See
# IMPLEMENTATION_PLAN.md §The josh-mcp arm.
get-jars = "python scripts/get_jars.py"
# Render per-cell k8s Job manifests from a matrix CSV (or a single cell).
# Args are passed through, e.g.:
#   pixi run render -- --batch-tag smoke --cells orchestration/matrix.csv \
#       --image-agent ghcr.io/.../fortree-agent:SHA \
#       --image-scorer ghcr.io/.../fortree-scorer:SHA
render = "python orchestration/render_jobs.py"
# Render + kubectl apply in one shot. Same args as render.
apply = "./orchestration/k8s_apply.sh"
# Pull a finished batch's artefacts from GCS into runs/<batch-tag>/.
pull = "./orchestration/pull_artefacts.sh"
# Re-hydrate one cell for inspection: pull its artefacts (incl. the
# auto-generated transcript.md) and import each opencode step-session so you
# can browse them in `opencode`. Usage: pixi run rehydrate <batch> <cell-id>.
rehydrate = { cmd = """bash -c '
set -e
MINIO_PREFIX="$1" ./orchestration/pull_artefacts.sh "$1" >/dev/null
shopt -s nullglob; n=0
for f in "runs/$1/$2"/agent_meta/steps/step_*/session_export.json; do opencode import "$f"; n=$((n+1)); done
echo "rehydrated $n session(s) for $2 -> browse: opencode (session list) | transcript: runs/$1/$2/transcript.md"
' rehydrate {{ BATCH }} {{ CELL }}""", args = [{ arg = "BATCH" }, { arg = "CELL" }] }
# Roll up per-cell scorer.json + fuzzy outputs into one CSV for analysis.
aggregate = "python analysis/aggregate.py"
# Open the headline notebook for analysis. `--no-browser` because the
# devcontainer forwards the port out; click the link in the terminal.
lab = "jupyter lab --no-browser --ip=0.0.0.0 --port=8888 --ServerApp.token=''"

[dependencies]
python = ">=3.12,<3.13"
# Used by orchestration/render_jobs.py.
pyyaml = ">=6.0.3,<7"
jinja2 = ">=3.1,<4"
# Analysis. pandas + matplotlib for analysis/aggregate.py + headline.ipynb;
# jupyterlab + ipykernel so `pixi run lab` works out of the box.
pandas = ">=2.2,<3"
matplotlib = ">=3.8,<4"
jupyterlab = ">=4,<5"
ipykernel = ">=6,<7"
