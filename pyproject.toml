[project]
name = "fortree-orchestrator"
version = "0"
description = "ForeverTree LLM experiment harness — host-side analysis tools for batches submitted to GKE as per-cell k8s Jobs. See pixi.toml for the canonical host env."
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Post-experiment analysis: aggregate batch manifests + fuzzy sidecars
# into one CSV, then render the headline figure as a Jupyter notebook.
# Install with `uv sync --extra analysis`.
analysis = [
    "pandas>=2",
    "matplotlib>=3.8",
    "jupyterlab>=4",
    "ipykernel>=6",
]

[tool.uv]
package = false
