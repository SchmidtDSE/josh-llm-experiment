# Dependabot config — watch the things hash-pinned in this repo so a
# malicious tag rewrite (or stale pin) gets a routine PR.
#
# - github-actions: scans every workflow under .github/workflows/ for
#   `uses: owner/action@sha # version` lines and proposes bumps with the
#   matching SHA + comment.
# - docker: bumps the FROM lines in every Dockerfile* at the repo root,
#   currently `Dockerfile` (base/agent/scorer — python:3.11-slim-bookworm)
#   and `Dockerfile.dnsmasq` (sidecar — alpine:3.20). Dependabot's docker
#   ecosystem auto-discovers all `Dockerfile*` files in the configured
#   directory, so no per-file entry is needed.
#
# Note: dependabot does NOT scan workflow-embedded image references like
# the ollama/ollama digest in integration-ollama.yml's env block, so that
# pin is currently bumped by hand. Renovate would catch it; revisit if the
# manual churn becomes a problem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
