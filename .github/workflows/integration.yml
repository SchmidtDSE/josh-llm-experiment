name: integration

# End-to-end agent run. workflow_dispatch only. Supports both inference
# paths via a single MODEL input (config/models.yaml resolves the short
# name to a provider+slug):
#
#   - ollama-* shortnames     → free; spins up an ollama container on
#                               the runner, pulls the requested model,
#                               agent reaches it via host.docker.internal.
#                               Slow on CPU runners (qwen 7b often can't
#                               emit before the idle watcher fires).
#   - any other shortname     → uses OpenRouter; requires repo secret
#                               OPENROUTER_API_KEY. ~$0.10 per dispatch
#                               for claude; completes reliably.
#
# Provider setup (start ollama OR write OPENROUTER_API_KEY to .env) is
# dispatched in .github/scripts/setup-provider.sh based on the MODEL
# prefix. Build steps, agent launch, scorer, report render, summary
# publish, artifact upload are shared.
#
# Outputs a workflow artifact containing the full runs/<id>/ tree plus
# a rendered report.md, and posts the same report into the run's
# Summary tab for in-UI review.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Short name from config/models.yaml (ollama-* for key-free runs, otherwise uses OpenRouter via the OPENROUTER_API_KEY repo secret)'
        required: true
        default: 'claude'
      rung:
        description: 'Prompt rung (1 or 5)'
        required: true
        default: '5'
      target:
        description: 'Target stack (josh or mesa)'
        required: true
        default: 'mesa'

env:
  # Pinned by digest so a malicious tag-rewrite on Docker Hub can't change
  # what we run. Bump alongside dependabot PRs that update the tag suffix.
  OLLAMA_IMAGE: 'ollama/ollama:0.24.0@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build fortree:agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: agent
          tags: fortree:agent
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fortree:scorer image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: scorer
          tags: fortree:scorer
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fortree:dnsmasq image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: Dockerfile.dnsmasq
          tags: fortree:dnsmasq
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up inference provider, write .env
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: .github/scripts/setup-provider.sh "$OLLAMA_IMAGE" "${{ inputs.model }}"

      - name: Launch agent run
        id: run
        run: |
          set -euo pipefail
          RUN_ID="ci-$(uuidgen)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          MODEL="${{ inputs.model }}" \
          RUNG="${{ inputs.rung }}" \
          TARGET="${{ inputs.target }}" \
          RUN_ID="$RUN_ID" \
          WALL_CLOCK_BACKSTOP_SEC=1800 \
          IDLE_THRESHOLD_SEC=600 \
            ./orchestration/launch_run.sh || true
          # `|| true`: we want the workflow to keep going so the artifact +
          # report capture whatever the agent produced, even on failure.
          # IDLE_THRESHOLD_SEC=600 gives ollama 7b on CPU a chance to
          # produce a first token; it's harmless on the openrouter path
          # (claude exits naturally well before that).

      - name: Score workspace
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.run.outputs.run_id }}"
          RUN_DIR="runs/$RUN_ID"
          mkdir -p "$RUN_DIR"
          docker run --rm --network=none \
            -v "$PWD/$RUN_DIR/workspace":/sandbox \
            -v "$PWD/data":/sandbox/data:ro \
            fortree:scorer /opt/entrypoint-scorer.sh --target "${{ inputs.target }}" \
            > "$RUN_DIR/scorer.json" || true
          echo "--- scorer.json ---"
          cat "$RUN_DIR/scorer.json" || true

      - name: Generate run report
        # Runs inside fortree:scorer because that image carries the
        # report's pip deps (jinja2 via config/requirements.txt). The
        # GH runner host doesn't have them.
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.run.outputs.run_id }}"
          docker run --rm --network=none \
            -v "$PWD/runs/$RUN_ID":/run \
            -v "$PWD/orchestration":/opt/orchestration:ro \
            fortree:scorer \
            python3 /opt/orchestration/generate_run_report.py /run \
            > "runs/$RUN_ID/report.md"
          echo "--- report.md (head) ---"
          head -50 "runs/$RUN_ID/report.md"

      - name: Publish report.md to the workflow Summary tab
        # Posts the rendered Markdown into the workflow run's Summary so a
        # reviewer can read the verdict + workspace + tool trace directly
        # in the GH UI, without downloading the artifact. $GITHUB_STEP_SUMMARY
        # has a 1 MiB cap; our reports are ~50-100 KB.
        if: always()
        run: |
          set -euo pipefail
          REPORT="runs/${{ steps.run.outputs.run_id }}/report.md"
          if [ -s "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(no report.md produced — see workflow logs and artifact)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect ollama logs (ollama path only)
        if: always() && startsWith(inputs.model, 'ollama-')
        run: |
          docker logs ollama > "runs/${{ steps.run.outputs.run_id }}/ollama.log" 2>&1 || true

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: run-${{ steps.run.outputs.run_id }}-${{ inputs.model }}-rung${{ inputs.rung }}-${{ inputs.target }}
          path: runs/${{ steps.run.outputs.run_id }}/
          if-no-files-found: warn
