name: smoke

# Deterministic CI checks that exercise the harness without invoking a
# model. One job:
#
# - scorer-fixtures: builds fortree:scorer, runs it against every fixture
#   under reference/, asserts expected csv_schema_ok + error substring.
#
# The Phase 6 refactor retired the firewall-probe job along with the
# kernel-enforced egress sidecar (see Dockerfile.dnsmasq history and
# EXPERIMENTAL_DESIGN.md §Egress observability) — the sidecar is now a
# passive query logger, so there are no iptables REJECT rules to probe.
#
# Runs on every push and on PRs targeting dev or main. The actual
# assertion logic lives under .github/scripts/ so it's runnable locally
# without GH Actions.

on:
  push:
  pull_request:
    branches: [dev, main]

jobs:
  scorer-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build fortree:scorer image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          target: scorer
          tags: fortree:scorer
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run scorer against every fixture
        run: .github/scripts/smoke-fixtures.sh fortree:scorer
